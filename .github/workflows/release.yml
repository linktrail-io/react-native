name: Publish to npm

# Publishes the package to npm. Triggered by pushing a version tag (e.g. `0.0.3`)
# — `release`-event delivery is unreliable in this repo, but tag pushes fire — or
# run manually via "Run workflow" (workflow_dispatch) to test. The published
# version comes from package.json; bump it before tagging (npm rejects a
# re-publish of an existing version). Requires an `NPM_TOKEN` repo secret
# (npm automation token with publish rights to `linktrail-react-native`).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci # runs `prepare` (bob build) → lib/ is built before publish

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
