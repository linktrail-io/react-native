name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Docs-only pull requests skip the heavy work. The workflow still triggers on every PR, because
  # its jobs are required status checks and a paths-ignore would leave them pending forever.
  # Instead this job decides, and the jobs below still run (and report) but skip their heavy
  # steps, passing in seconds. Only a pull_request run can skip: push, merge_group, schedule,
  # workflow_dispatch and workflow_call always run in full. So does anything unexpected (git
  # error, empty diff, this job failing). The patterns live in scripts/docs-only-changes.sh.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff needs the base branch and the merge base

      - name: Decide whether this is a docs-only change
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event '$EVENT': full run."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved into docs/ shows as delete + add, so it still counts as code.
          if ! files="$(git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD")"; then
            echo "::warning::Could not list changed files against origin/$BASE_REF; running everything."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
          verdict="$(printf '%s\n' "$files" | bash scripts/docs-only-changes.sh)" || verdict=""
          [ "$verdict" = "docs_only=true" ] || verdict="docs_only=false"
          echo "$verdict" >> "$GITHUB_OUTPUT"

  ios:
    name: Build example (iOS simulator)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Ruby + CocoaPods (bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install library dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Pod install (retries — CocoaPods CDN can be flaky)
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          for i in 1 2 3; do
            bundle exec pod install --repo-update && exit 0
            echo "pod install attempt $i failed; retrying…"
            sleep 5
          done
          echo "pod install failed after 3 attempts" >&2
          exit 1

      - name: Build (Debug, iOS simulator)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace KickFlip.xcworkspace \
            -scheme KickFlip \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
