name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Lint · Typecheck · Build · Codegen
    # Public repo: fork pull_request runs never reach the self-hosted Macs (fork-PR approval is on too).
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    # Every job runs on the org's self-hosted Mac minis (no GitHub-hosted minutes).
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build package (react-native-builder-bob)
        run: npm run prepare

      - name: Validate native codegen spec
        run: node node_modules/react-native/scripts/generate-codegen-artifacts.js -p . -o "${RUNNER_TEMP}/codegen" -t all

  example-android:
    name: Example · JS + Android build
    # Public repo: fork pull_request runs never reach the self-hosted Macs (fork-PR approval is on too).
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Actions cache on the self-hosted Macs: ~/.gradle persists there and Gradle locks it for
      # concurrent builds, while restoring a cache over it from several jobs at once would not be safe.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # The SDK packages example/android pins (compileSdk 35, build-tools 35.0.0, NDK 27.1, and the
      # CMake RN's new-architecture build uses), reused when present. The hosted image had them.
      - name: Android SDK
        run: bash scripts/ci/android-sdk.sh platform-tools "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install library dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Typecheck example
        working-directory: example
        run: npx tsc --noEmit

      - name: Bundle JS (Android + iOS)
        working-directory: example
        run: |
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output "${RUNNER_TEMP}/android.bundle" --assets-dest "${RUNNER_TEMP}/android-assets"
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output "${RUNNER_TEMP}/ios.bundle" --assets-dest "${RUNNER_TEMP}/ios-assets"

      - name: Build debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon
