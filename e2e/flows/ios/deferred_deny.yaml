# Deferred · consent DENY (real). Same staging as deferred_allow; the user denies and taps Paste.
# Nothing may be attributed and onLink may fire at most once. Afterwards e2e/ios.sh checks the
# backend recorded no install for the staged token.
appId: io.linktrail.kickflipdemo
---
- launchApp
- extendedWaitUntil: { visible: "Allow tracking?", timeout: 30000 }
- tapOn: { id: "consent-deny" }
- tapOn: { text: "^Paste$" }
- extendedWaitUntil: { visible: { id: "e2e-consent", text: "consent: denied" }, timeout: 10000 }
- extendedWaitUntil: { visible: "never-shown-e2e-pause", timeout: 5000, optional: true }
- assertNotVisible: { id: "e2e-attribution", text: "attribution: attributed=true" }
- assertNotVisible: { id: "e2e-link-count", text: "onLink: [2-9].*" }
