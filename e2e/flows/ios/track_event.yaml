# trackEvent with a value (real): with consent granted, the panel sends
# trackEvent("e2e_purchase", { value: 9.99, currency: "USD" }) and shows the backend's answer.
appId: io.linktrail.kickflipdemo
---
- launchApp
- extendedWaitUntil: { visible: "Allow tracking?", timeout: 30000 }
- tapOn: { id: "consent-skip" }
- tapOn: { id: "e2e-grant-consent" }
- extendedWaitUntil: { visible: { id: "e2e-consent", text: "consent: granted" }, timeout: 10000 }
- tapOn: { id: "e2e-track-event" }
- extendedWaitUntil: { visible: { id: "e2e-event", text: "event: ok id=.*" }, timeout: 30000 }
