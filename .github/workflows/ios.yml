name: iOS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    name: Build example (iOS simulator)
    # Public repo: fork pull_request runs never reach the self-hosted Macs (fork-PR approval is on too).
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    # Every job runs on the org's self-hosted Mac minis (no GitHub-hosted minutes).
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ruby/setup-ruby's prebuilt Rubies only install on GitHub-hosted images. scripts/ci/ruby.sh uses
      # Homebrew's Ruby with every gem in RUNNER_TEMP (nothing global); bundler then installs the
      # Gemfile's CocoaPods there.
      - name: Set up Ruby + CocoaPods (bundler)
        run: bash scripts/ci/ruby.sh

      - name: Install CocoaPods (bundler)
        working-directory: example
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle install --jobs 4 --retry 3

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install library dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Pod install (retries — CocoaPods CDN can be flaky)
        working-directory: example/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          for i in 1 2 3; do
            bundle exec pod install --repo-update && exit 0
            echo "pod install attempt $i failed; retrying…"
            sleep 5
          done
          echo "pod install failed after 3 attempts" >&2
          exit 1

      - name: Build (Debug, iOS simulator)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace KickFlip.xcworkspace \
            -scheme KickFlip \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
