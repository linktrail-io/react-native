name: Publish to npm

# Publishes the package when you publish a GitHub Release. The version comes from
# package.json — bump it before tagging/releasing (npm rejects a re-publish of an
# existing version). Requires an `NPM_TOKEN` repository secret (npm automation
# token with publish rights to `linktrail-react-native`).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci # runs `prepare` (bob build) → lib/ is built before publish

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
